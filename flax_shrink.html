<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parent{
            height: 600px;width: 800px;border: 1px solid;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #parent div{
            width: 100px;height: 100px;border: 1px solid red;
            font-size: 80px;
           text-align: center;
        }
        #parent div:nth-child(2){
            background-color: red;
         /*   align-self:flex-end ; */ /* flex-end, flex-start*/
       /*   order: 1; */
    /*   flex-shrink: 0; */ /* shrink nahi hoga*/
       flex-shrink: 2;  /* ye doguna shrink hoga*/
       flex-grow: 1;

      /*  flex-basis: 250px; */

        }
        #parent div:nth-child(3){
            background-color: yellow;
            flex-grow: 3;
        }
        
    </style>
</head>
<body>
    <div id="parent">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
   
    </div>
</body>
</html>
