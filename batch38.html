<html>
    <head>
       <style>
        #myh1{
            animation-name: abc;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            animation-duration: 1s;

        }
        @keyframes abc {
            0%{
                color: aqua;
            }
            50%{
                color:black;
            }
            100%{
                color: red;
            }
        }
       </style>
    </head>
    <body>
      <h1 id="myh1">digicoders</h1>
    </body>
</html>
