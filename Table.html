    <body>
        <h2>Multiplication Table Generator</h2><br><br>
       <input type="number" id="number"/><br>
       <button onclick="myName()" id="t1">Generate Table</button>
       <p id="result">Table of</p>
       <script>
        function myName(){
            var a = (t1).value;
         //   var i, temp
            for( i =1; i<=10; i++){
                // a = parseInt(a);
                	result.innerHTML += a+"x"+i+"="+a*i+"<br>";
            }
        }
       </script>
    </body>
