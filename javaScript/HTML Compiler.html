<html>
    <head>
    <style>
        #box1{
            width: 100%;
            min-height: 700px;
            background-color: chocolate;
        }
        #box2{
            width: 50%;
            min-height: 700px;
            background-color: beige;
            float: left;
        }
        #box3{
            width: 50%;
            min-height: 700px;
            background-color: azure;
            float: left;
        }
    </style>
    </head>
    <body>
        
        <h1> HTML Compiler</h1>

        <div id="box1">
            <div id="box2">
                <textarea rows="40" cols="100" id="t1" onkeyup="demo()"></textarea>
            </div>
             <div id="box3"></div>
             
        </div>
        <script>
            function demo(){
                box3.innerHTML = t1.value;
            }
        </script>
    </body>
</html>
