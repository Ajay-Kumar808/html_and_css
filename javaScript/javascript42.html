<html>
    <head>

    </head>
    <body onload="changetext()">
        <h1 id="myheading"> DigiCoder</h1>
     
        <script>
            var mytext = ["Ajay", "Vikrak", "Arun", "Monu", "Coding"];
            var mycolors = ["red", "blue", "pink", "yellow", "black"];
            var i=0;

            function changetext(){
                myheading.innerHTML = mytext[i];
                myheading.style.color = mycolors[i];    
                i++;

                if(i==mytext.length){
                    i=0;
                }

                setTimeout(changetext,1000);     //Time in m/s
            }
        </script>
    </body>
</html>k
