<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        #bigbox{
            width: 380px;height: 491px;
            border: 2px solid #2A9DF4;;
            margin: 100px auto;
            border-radius: 20px;
            overflow: hidden;
        }
        #top{
      width: 400px;height: 80px;border-bottom: 1px solid blue ;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #2A9DF4;
       
       
     
      
        }
        #top h1{
            
        }
        #main{
            width: 400px;height: 350px;
        background-color:  #A8CDE4;
        }
        .box1{
            width:200px;
            height: 30px;
            border: 1px solid #2A9DF4;;
           position: relative;
            display: flex;
            align-items: center;
            padding-left: 12px;
             border-radius: 20px;
             top: 40px;
             left: 18px;
             background-color: #e7edf1;

            
        }
        .box2{
            width:200px;
            height: 30px;
            border: 1px solid #2A9DF4;
            margin: 60px 0px 0px 170px;
              position: relative;
             display: flex;
            align-items: center;top:40px;
            padding-left: 12px;
            border-radius: 20px;
            right: 18px;background-color: #e7edf1;


            
        }
        #down{
            width: 400px;height: 60px;
       align-items: center;
               display: flex;
 border-top: 1px solid blue ;
 background-color:  #2A9DF4;
 column-gap: 10px;
          
        }
        .box3{
            width: 180px;
            height: 30px;
            border: 1px solid #2A9DF4;
             margin-top: 8px;
             margin-left: 10px;
            display: flex;
            align-items: center;
            border-radius: 20px;background-color: #e7edf1;
            padding-left: 12px;
            
        }
        .box4{
            width: 70px;
            height: 30px;
            border: 1px solid #2A9DF4;
            margin-top: 8px;
            
             display: flex;
             align-items: center;
                         border-radius: 20px;
             justify-content: space-around;background-color: #e7edf1;
           
             
        }
        #top span{
            position: relative;
            left: -70px;
            color: #e7edf1;
            font-size: 20px;
        }
        #plush{
            position: relative;
            top: 150px;
            left: 310px;
            font-size: 45px;
            color: #141516;;
        }
    </style>
</head>
<body>
    <div id="bigbox">
    <div id="top">
        <span> <i class="fa-solid fa-users-gear"></i></span>
      
        <h1>AI ChatBox</h1>
    </div>
    <div id="main">
        <div class="box1">how are you</div>
        <div class="box2">thik</div>
        <div id="plush"><i class="fa-solid fa-square-plus"></i></div>

    </div>
    <div id="down">
        <div class="box3">Typing here...</div>
        <div class="box4">Send..</div>
        <div class="box4"><i class="fa-solid fa-microphone"></i></div>

    </div>
    </div>
</body>
</html>
